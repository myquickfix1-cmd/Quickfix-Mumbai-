<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix Mumbai | Expert Appliance Repair</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B132B] text-white font-sans">

    <div class="relative h-[250px] w-full overflow-hidden shadow-2xl">
        <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd756?w=800" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-center px-4">
            <h1 class="text-2xl font-bold text-white mb-1">Quickfix Mumbai</h1>
            <p class="text-blue-400 text-sm font-medium italic">"It's broken, consider it fixed!"</p>
        </div>
    </div>

    <div class="py-6 px-4">
        <h2 class="text-xl font-bold text-white mb-4">Our Service Network</h2>
        <div class="grid grid-cols-1 gap-4">
            <a href="bandra.html" class="relative group rounded-xl overflow-hidden h-32 border border-blue-800 flex items-center justify-center bg-blue-900/50">
                <span class="text-white text-xl font-bold">Bandra</span>
            </a>
            <a href="andheri.html" class="relative group rounded-xl overflow-hidden h-32 border border-blue-800 flex items-center justify-center bg-blue-900/50">
                <span class="text-white text-xl font-bold">Andheri</span>
            </a>
            <a href="malad.html" class="relative group rounded-xl overflow-hidden h-32 border border-blue-800 flex items-center justify-center bg-blue-900/50">
                <span class="text-white text-xl font-bold">Malad</span>
            </a>
        </div>
    </div>

    <section class="p-6 pb-24">
        <form id="leadDispatchForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase">Customer Full Name</label>
                <input type="text" id="custName" placeholder="Enter your name" class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-white mt-1">
            </div>
            <button type="submit" class="w-full bg-blue-600 p-3 rounded-xl font-bold text-white hover:bg-blue-700 transition">Confirm Dispatch</button>
        </form>
    </section>

    <footer class="text-center py-6 border-t border-gray-800">
        <p class="text-gray-500 text-xs">© 2026 QuickFix Mumbai Engineering Fleet</p>
    </footer>

</body>
</html>
