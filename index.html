<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickfix Mumbai | Advance Booking</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        .emergency { background: #dc3545; color: white; padding: 20px; text-align: center; animation: pulse 1.5s infinite; font-weight: bold; }
        @keyframes pulse { 0% { background: #dc3545; } 50% { background: #ff4d4d; } 100% { background: #dc3545; } }
        .about-section { background: white; padding: 20px; line-height: 1.6; border-bottom: 3px solid #007bff; }
        .booking-form { background: #fff; padding: 20px; margin: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { display: block; width: 100%; padding: 15px; background: #25d366; color: white; text-align: center; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1em; cursor: pointer; }
    </style>
</head>
<body>

    <div class="emergency">🚨 24/7 EMERGENCY REPAIR - CALL NOW!</div>

    <div class="about-section">
        <h2>Welcome to Quickfix</h2>
        <p>15+ years of trust, 100,000+ families served. Expert technicians at your doorstep.</p>
    </div>

    <div class="booking-form">
        <h3>📅 Advance Booking (Flat 30% OFF)</h3>
        <form id="bookingForm" onsubmit="sendWhatsApp(event)">
            <label>Select Item:</label>
            <select id="item" required>
                <option value="Refrigerator">Refrigerator</option>
                <option value="Washing Machine">Washing Machine</option>
                <option value="Microwave">Microwave</option>
                <option value="Dishwasher">Dishwasher</option>
                <option value="Cloth Dryer">Cloth Dryer</option>
                <option value="Air Dresser">Air Dresser</option>
            </select>
            <label>Problem Description (Optional):</label>
            <textarea id="desc" rows="3" placeholder="Kuch aur batana chahte hain?"></textarea>
            <button type="submit" class="btn">Book via WhatsApp</button>
        </form>
    </div>

    <script>
        function sendWhatsApp(event) {
            event.preventDefault();
            const item = document.getElementById('item').value;
            const desc = document.getElementById('desc').value;
            const phone = "919930249182";
            const url = `https://wa.me/${phone}?text=Hello, I want to book an advance service for: ${item}. Problem: ${desc}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
