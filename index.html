<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickfix Mumbai | Doorstep Repair</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0066ff; --wa-primary: #25D366; --wa-sec: #128C7E; --dark: #1a202c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f6; color: #333; }
        
        .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; padding-bottom: 100px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        /* Header */
        header { padding: 25px; text-align: center; background: var(--primary); color: white; }
        
        /* Form Section */
        .form-section { padding: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Service Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        .card { padding: 15px; border: 1px solid #eee; border-radius: 10px; text-align: center; cursor: pointer; background: #f9f9f9; }
        
        /* Floating Nav */
        .fixed-footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
        .btn-wa { padding: 15px; color: white; text-decoration: none; text-align: center; font-weight: bold; font-size: 14px; }
        .wa-primary { background: var(--wa-primary); }
        .wa-sec { background: var(--wa-sec); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ Quickfix Mumbai</h1>
            <p>15+ Years Experience | Expert Technicians</p>
        </header>

        <!-- Booking Form -->
        <div class="form-section">
            <h3>Book a Technician</h3>
            <input type="text" id="name" placeholder="Your Name">
            <select id="service">
                <option value="Washing Machine">Washing Machine</option>
                <option value="Refrigerator">Refrigerator</option>
                <option value="Microwave">Microwave</option>
                <option value="PCB Repair">PCB Repair</option>
            </select>
            <button class="submit-btn" onclick="submitForm()">BOOK NOW</button>
        </div>

        <!-- Services -->
        <div class="grid">
            <div class="card" onclick="sendWA('919930249182', 'Washing Machine Repair')">🧺 Machine</div>
            <div class="card" onclick="sendWA('919930249182', 'Fridge Repair')">❄️ Fridge</div>
        </div>
    </div>

    <!-- Footer Nav -->
    <div class="fixed-footer">
        <a href="#" class="btn-wa wa-primary" onclick="sendWA('919930249182', 'General Query')">
            <i class="fab fa-whatsapp"></i> Primary Support
        </a>
        <a href="#" class="btn-wa wa-sec" onclick="sendWA('9594406045', 'General Query')">
            <i class="fab fa-whatsapp"></i> Secondary Support
        </a>
    </div>

    <script>
        function sendWA(number, service) {
            const msg = `Hello, I need help with: ${service}`;
            window.open(`https://wa.me/${number}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function submitForm() {
            const name = document.getElementById('name').value;
            const service = document.getElementById('service').value;
            if(!name) { alert("Please enter your name"); return; }
            const fullMsg = `Hi, I am ${name}. I need service for: ${service}`;
            window.open(`https://wa.me/919930249182?text=${encodeURIComponent(fullMsg)}`, '_blank');
        }
    </script>
</body>
</html>
