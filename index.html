<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix Mumbai | Premium Elite Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blink-indicator { animation: blink 1.5s infinite; }
    </style>
</head>
<body class="bg-[#0B132B] text-white font-sans pb-24">

    <section class="p-6 text-center">
        <h1 class="text-3xl font-black uppercase tracking-tighter">QuickFix <span class="text-[#0066FF]">Mumbai</span></h1>
        <p class="text-blue-400 font-bold italic text-sm">"Elite Engineering Desk"</p>
    </section>

    <section class="px-4 py-2">
        <div class="bg-[#141E3D] p-4 rounded-2xl border border-yellow-500/30 mb-4 relative">
            <div id="weekend-blinker" class="absolute top-4 right-4 w-3 h-3 bg-yellow-400 rounded-full"></div>
            
            <h2 class="text-md font-bold text-yellow-400">⚡ WEEKEND SPECIAL: 18% OFF</h2>
            <p class="text-[10px] text-gray-400 mt-1">Book now for weekend slots. Inspection fee (₹149) adjustable against final bill.</p>
        </div>
        <input type="date" id="serviceDate" class="w-full bg-[#0B132B] p-3 rounded-xl border border-gray-700 outline-none">
    </section>

    <section class="px-4 py-4">
        <h2 class="text-[10px] font-bold text-gray-500 mb-3 uppercase tracking-widest">Select Priority Dispatch</h2>
        <div class="grid grid-cols-2 gap-3">
            <button class="bg-blue-700 p-4 rounded-xl border-b-4 border-blue-900">
                <span class="block font-black text-sm">VIP ELITE</span>
                <span class="text-[10px] opacity-80">₹499 Pre-Pay | 45m</span>
            </button>
            <button class="bg-gray-800 p-4 rounded-xl border-b-4 border-gray-900">
                <span class="block font-black text-sm">VIP FAST</span>
                <span class="text-[10px] opacity-80">₹199 Pre-Pay | 90m</span>
            </button>
        </div>
    </section>

    <section class="px-4 py-2">
        <button onclick="alert('Mic On: Speak your problem')" class="w-full bg-red-900/40 border border-red-500 p-3 rounded-xl mb-4 font-bold text-sm">🎙️ Record Your Problem (Free)</button>
        <div class="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div class="bg-gray-800 p-2 rounded">AC</div><div class="bg-gray-800 p-2 rounded">Fridge</div><div class="bg-gray-800 p-2 rounded">W.Machine</div>
            <div class="bg-gray-800 p-2 rounded">Microwave</div><div class="bg-gray-800 p-2 rounded">Air Dresser</div><div class="bg-gray-800 p-2 rounded">PCB Repair</div>
        </div>
    </section>

    <section class="px-4 py-6 text-center">
        <div class="bg-white p-2 inline-block rounded-xl mb-2">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=quickfixmumbai.com" class="w-24 h-24">
        </div>
        <p class="text-[10px] font-bold text-blue-500 tracking-widest">QUICKFIX MUMBAI | QUICKFIXMUMBAI.COM</p>
    </section>

    <div class="fixed bottom-0 left-0 w-full p-4 bg-[#0B132B] border-t border-gray-800 z-50">
        <button id="confirm-btn" class="w-full bg-green-600 py-4 rounded-xl font-black text-lg shadow-[0_0_20px_rgba(22,163,74,0.3)]">CONFIRM & PAY VIP FEE</button>
    </div>

    <script>
        function checkWeekend() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            // Friday after 18:00 till Sunday 23:59
            const isWeekend = (day === 5 && hour >= 18) || (day === 6) || (day === 0);

            if (isWeekend) {
                document.getElementById('weekend-blinker').classList.add('blink-indicator');
                document.getElementById('confirm-btn').classList.add('animate-pulse');
            }
        }
        window.onload = checkWeekend;
    </script>

</body>
</html>
