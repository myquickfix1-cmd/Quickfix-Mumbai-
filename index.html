<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix Mumbai | Elite Engineering Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse-fix { animation: pulse 2s infinite; }
    </style>
</head>
<body class="bg-[#0B132B] text-white font-sans pb-24">

    <!-- Header Section -->
    <section class="p-6 text-center">
        <h1 class="text-3xl font-black uppercase tracking-tighter">QuickFix <span class="text-[#0066FF]">Mumbai</span></h1>
        <p class="text-blue-400 font-bold italic text-sm">"Elite Engineering Desk"</p>
        <p class="text-[10px] text-gray-500 mt-2 font-bold uppercase tracking-widest">Master in Home Appliances & Complex Electronics</p>
    </section>

    <!-- Professional Identity Tags -->
    <section class="px-4 grid grid-cols-2 gap-2 mb-6">
        <div class="bg-[#141E3D] p-3 rounded-xl border border-blue-500/30 text-[9px] font-bold text-center">✅ HIGH-LEVEL REPAIRING</div>
        <div class="bg-[#141E3D] p-3 rounded-xl border border-blue-500/30 text-[9px] font-bold text-center">🔄 QUICK RESTORE</div>
        <div class="bg-[#141E3D] p-3 rounded-xl border border-blue-500/30 text-[9px] font-bold text-center">🛠️ NON-RESOLVED FIXED</div>
        <div class="bg-[#141E3D] p-3 rounded-xl border border-blue-500/30 text-[9px] font-bold text-center">⚡ QUICK SOLVED</div>
    </section>

    <!-- Data Collection Form -->
    <section class="px-4 mb-6">
        <input type="text" placeholder="Your Name" class="w-full bg-[#141E3D] p-3 rounded-xl mb-2 border border-gray-700 outline-none">
        <select class="w-full bg-[#141E3D] p-3 rounded-xl border border-gray-700 outline-none text-gray-400">
            <option>Select Area (West Mumbai)</option>
            <option>Bandra</option>
            <option>Andheri</option>
            <option>Malad</option>
        </select>
    </section>

    <!-- Kalia Style Voice Integration -->
    <section class="px-4 mb-6">
        <button id="recordBtn" class="w-full flex items-center justify-center gap-3 bg-red-900/40 border border-red-500/50 py-4 rounded-xl font-bold text-red-100 pulse-fix">
            <span>🎙️</span> RECORD YOUR PROBLEM (FREE)
        </button>
        <p class="text-[9px] text-center text-gray-500 mt-2 italic">"Kalia hears it all—record and get a faster diagnosis!"</p>
    </section>

    <!-- VIP Priority Dispatch -->
    <section class="px-4 py-4 border-t border-gray-800">
        <h2 class="text-[10px] font-bold text-gray-500 mb-3 uppercase tracking-widest">Quick Repair Dispatch</h2>
        <div class="grid grid-cols-2 gap-3">
            <button class="bg-blue-700 p-4 rounded-xl border-b-4 border-blue-900">
                <span class="block font-black text-sm">VIP ELITE</span>
                <span class="text-[10px] opacity-80">₹499 Pre-Pay | 45m</span>
            </button>
            <button class="bg-gray-800 p-4 rounded-xl border-b-4 border-gray-900">
                <span class="block font-black text-sm">VIP FAST</span>
                <span class="text-[10px] opacity-80">₹199 Pre-Pay | 90m</span>
            </button>
        </div>
    </section>

    <!-- Sticky Booking -->
    <div class="fixed bottom-0 left-0 w-full p-4 bg-[#0B132B] border-t border-gray-800 z-50">
        <button class="w-full bg-green-600 py-4 rounded-xl font-black text-lg shadow-[0_0_20px_rgba(22,163,74,0.3)]">CONFIRM & PAY VIP FEE</button>
    </div>

</body>
</html>
