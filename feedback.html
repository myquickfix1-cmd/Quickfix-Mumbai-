<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty Activation | Quickfix Mumbai</title>
    <style>
        body { background-color: #0d1b2a; color: #ffffff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 20px; background: #152238; border: 1px solid #415a77; box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #4cc9f0; margin-bottom: 5px; }
        .sub-logo { font-size: 13px; color: #778da9; margin-bottom: 25px; }
        
        .btn-main, .input-field, .btn-verify, .btn-footer, .btn-whatsapp { width: 100%; box-sizing: border-box; }
        
        .btn-main { padding: 18px; margin-bottom: 30px; background: #4cc9f0; color: #0d1b2a; border: none; border-radius: 12px; font-weight: 800; text-decoration: none; display: inline-block; }
        .warranty-box { border-top: 1px solid #415a77; padding-top: 25px; width: 100%; }
        
        .input-field { padding: 14px; margin-bottom: 5px; border-radius: 10px; border: 1px solid #415a77; background: #0b1526; color: white; }
        .hint-text { color: #778da9; font-size: 11px; margin-bottom: 15px; display: block; text-align: left; padding-left: 5px; }
        
        .btn-verify { padding: 15px; margin-bottom: 20px; background: #1b263b; color: #ffffff; border: 1px solid #4cc9f0; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-footer { padding: 15px; margin-top: 10px; background: transparent; color: #ffffff; border: 1px solid #415a77; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-whatsapp { padding: 15px; background: #25D366; color: #ffffff; border: none; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 10px; }
        
        #success-message { display: none; padding: 20px; color: #ffffff; }
        .highlight { color: #4cc9f0; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">QUICKFIX MUMBAI</div>
        <div class="sub-logo">Premium Appliance Repair Service</div>
        
        <a href="https://bit.ly/QuickFixReview" target="_blank" class="btn-main">SUBMIT 5-STAR REVIEW</a>

        <div class="warranty-box" id="warranty-form">
            <h3 style="margin-top: 0;">Activate 6-Month Warranty</h3>
            <input type="text" id="custName" placeholder="Full Name" class="input-field">
            <input type="text" id="serviceId" placeholder="Service ID (e.g., QF-2606-0001)" class="input-field">
            <span class="hint-text">*Find your Service ID on your invoice/receipt.</span>
            <input type="tel" id="mobile" placeholder="Registered Mobile Number" class="input-field">
            <button class="btn-verify" onclick="activateWarranty()">VERIFY & ACTIVATE</button>
        </div>

        <div id="success-message">
            <h3>✅ Warranty Activated!</h3>
            <p>Thank you, <span id="display-name" class="highlight"></span>!</p>
            <p>Your 6-month warranty is now active for Service ID: <span id="display-id"></span>.</p>
        </div>

        <a href="https://wa.me/919819832282" class="btn-whatsapp">💬 CHAT ON WHATSAPP</a>
        <a href="https://quickfixmumbai.com" class="btn-footer">VISIT OFFICIAL WEBSITE</a>
    </div>

    <script>
        function activateWarranty() {
            const name = document.getElementById('custName').value.trim();
            const id = document.getElementById('serviceId').value.trim();
            const mobile = document.getElementById('mobile').value.trim();

            if (name !== "" && id !== "" && mobile !== "") {
                document.getElementById('display-name').innerText = name;
                document.getElementById('display-id').innerText = id;
                document.getElementById('warranty-form').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
            } else {
                alert("Please fill all the details to activate your warranty.");
            }
        }
    </script>
</body>
</html>
