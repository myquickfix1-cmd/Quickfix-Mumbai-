<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Collapsible function for the "Wikipedia-style" feel
        function toggleSection(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        }
    </script>
</head>
<body class="bg-white text-gray-900 max-w-2xl mx-auto p-4">

    <!-- 1 & 2: Navigation (Previous/Next) -->
    <nav class="flex justify-between py-4 border-b">
        <a href="previous_location.html" class="text-blue-700 font-bold">← Previous</a>
        <a href="next_location.html" class="text-blue-700 font-bold">Next →</a>
    </nav>

    <h1 class="text-3xl font-bold my-6">Appliance Repair in [LOCATION]</h1>

    <!-- Hero Image (Interactive look) -->
    <div class="overflow-hidden rounded-lg shadow-lg mb-6 hover:scale-105 transition duration-500">
        <img src="images/repair-service.jpg" class="w-full h-64 object-cover" alt="Service in [Location]">
    </div>

    <!-- 3: Wikipedia Style Collapsible Sections -->
    <div class="space-y-4">
        <div class="border-b">
            <button onclick="toggleSection('sec1')" class="w-full text-left py-3 font-bold text-lg">▼ Why Choose Us?</button>
            <div id="sec1" class="p-4 text-gray-700">Genuine parts, 6-month warranty, and expert technicians.</div>
        </div>
        <div class="border-b">
            <button onclick="toggleSection('sec2')" class="w-full text-left py-3 font-bold text-lg">▼ Our Services</button>
            <div id="sec2" class="p-4 text-gray-700">PCB, AC, Fridge, Microwave... (Full List)</div>
        </div>
        <div class="border-b">
            <button onclick="toggleSection('sec3')" class="w-full text-left py-3 font-bold text-lg">▼ Areas Covered</button>
            <div id="sec3" class="p-4 text-gray-700">Serving all of Mumbai including Bandra, Andheri, Malad...</div>
        </div>
    </div>

    <!-- Mumbai Tadka Section -->
    <div class="mt-8 p-6 bg-blue-50 rounded-xl text-center shadow-inner">
        <h2 class="text-2xl font-bold text-blue-800">QuickFix Mumbai ka Bharosa</h2>
        <p class="mt-2">Mumbai ki raftar, QuickFix ka samarpan!</p>
        <a href="tel:9819832282" class="mt-4 inline-block bg-blue-600 text-white px-8 py-3 rounded-full font-bold">Call Now</a>
    </div>

</body>
</html>
