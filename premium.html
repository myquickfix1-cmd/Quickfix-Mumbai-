<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ADVANCED TECHNICAL SEO METRIC TERMINAL -->
    <title>Best Appliance Repair Center Near Me | QuickFix Mumbai Expert Hub</title>
    <meta name="description" content="QuickFix Mumbai is India's No.1 trusted doorstep smart home appliance service center. Specialized in high-end residential towers and luxury appliance brands in Mumbai West. Claim 18% Off this weekend!">
    <meta name="keywords" content="Appliance Repair Mumbai, Luxury Appliance Specialist, Andheri West, Bandra West, Juhu Repair, PCB Repair Mumbai, Quickfix Service Repair, Appliance Repair Near Me">
    <meta name="author" content="QuickFix Mumbai">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; white-space: nowrap; animation: marquee 25s linear infinite; }
        html { scroll-behavior: smooth; }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#070B19] text-white font-sans antialiased">

    <!-- WEEKEND 18% OFFER BANNER -->
    <div id="weekendSpecialBanner" class="bg-gradient-to-r from-red-700 to-orange-600 text-center py-3 px-4 border-b border-white/20 sticky top-0 z-50 shadow-2xl">
        <span class="font-black text-[10px] bg-black/30 px-2 py-0.5 rounded uppercase tracking-widest animate-pulse">WEEKEND SPECIAL 18% OFF</span>
        <p class="text-xs sm:text-sm font-bold mt-1">Limited Time: Claim <span class="bg-white text-red-600 px-1 rounded font-mono">18% OFF</span> Expert Service!</p>
    </div>

    <div class="max-w-md mx-auto px-4 pt-4 pb-24">
        <header class="text-center mb-5">
            <h1 class="text-3xl font-black tracking-tight text-white mb-1">QUICKFIX <span class="text-[#0066FF]">MUMBAI</span></h1>
            <p class="text-xs tracking-widest text-gray-400 uppercase">Elite Home Appliance Engineering Fleet</p>
        </header>

        <!-- DUAL WHATSAPP & CALL DISPATCH -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="dialCoreEngine('whatsapp_1')" class="bg-gradient-to-b from-emerald-600 to-teal-700 text-white p-3 rounded-xl font-black text-[10px] shadow-lg">WHATSAPP LINE 1</button>
            <a href="tel:+919819832282" class="bg-gradient-to-b from-[#FF4500] to-[#FF8C00] text-white p-3 rounded-xl font-black text-[10px] text-center shadow-lg">BOOK CALL</a>
            <button onclick="dialCoreEngine('whatsapp_2')" class="bg-gradient-to-b from-blue-600 to-indigo-700 text-white p-3 rounded-xl font-black text-[10px] shadow-lg">WHATSAPP LINE 2</button>
        </div>

        <!-- CORPORATE DISPATCH FORM -->
        <section class="bg-[#141E3D] border border-blue-900/30 rounded-2xl p-5 mb-6 shadow-xl">
            <h3 class="text-lg font-black text-white mb-1">Corporate Lead Dispatch</h3>
            <div class="space-y-3.5">
                <input type="text" id="formCustomerName" placeholder="Full Name" class="w-full bg-[#0B132B] border border-gray-700 rounded-xl p-3 text-xs text-white">
                <select id="userLocationSelection" class="w-full bg-[#0B132B] border border-gray-700 rounded-xl p-3 text-xs text-white">
                    <option value="Andheri West">Andheri West</option>
                    <option value="Bandra West">Bandra West</option>
                    <option value="Juhu">Juhu</option>
                </select>
                <button onclick="executeDispatch()" class="w-full bg-blue-600 py-3 rounded-xl font-black text-sm uppercase">Confirm 18% Off Reservation</button>
            </div>
        </section>
    </div>

    <script>
        function dialCoreEngine(channelType) {
            let name = document.getElementById('formCustomerName').value || 'Customer';
            let location = document.getElementById('userLocationSelection').value;
            let discountTag = "【CLAIMED: 18% WEEKEND EXPERT DISCOUNT】";
            
            let message = `*QuickFix Mumbai - Lead*\nName: ${name}\nArea: ${location}\nOffer: ${discountTag}`;
            
            // Dispatch to primary
            window.open("https://wa.me/919819832282?text=" + encodeURIComponent(message), '_blank');
            console.log("Dispatching to " + channelType + " with " + discountTag);
        }

        function executeDispatch() {
            dialCoreEngine('whatsapp_1');
        }
    </script>
</body>
</html>
